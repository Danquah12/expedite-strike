worker_processes 1;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        location /app/assessment/ { set $up aegis-spectre:9012;  proxy_pass http://$up; }
        location /app/redteam/    { set $up aegis-viper:9013;    proxy_pass http://$up; }
        location /app/attack/     { set $up aegis-trident:9014;  proxy_pass http://$up; }
        location /app/defence/    { set $up aegis-rampart:9015;  proxy_pass http://$up; }
        location /app/intel/      { set $up aegis-echelon:9016;  proxy_pass http://$up; }
        location /app/grc/        { set $up aegis-bulwark:9017;  proxy_pass http://$up; }
        location /app/specialised/{ set $up aegis-corsair:9018;  proxy_pass http://$up; }
        location /app/ai/         { set $up aegis-nexus:9019;    proxy_pass http://$up; }
        location /app/reports/    { set $up aegis-ledger:9020;   proxy_pass http://$up; }
        location /                { set $up aegis-bastion:9011;  proxy_pass http://$up; }
    }
}
