###############################################################
# Aegis SOC Platform — Production Nginx Configuration
# Proxy: 80/443 → localhost:9009
# SSL:   self-signed cert at /opt/vuln_intel/app/ssl/
###############################################################

worker_processes auto;
pid        /opt/vuln_intel/app/ssl/nginx.pid;
error_log  /opt/vuln_intel/app/ssl/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Temp paths (writable, not /var/lib/nginx) ─────────────────
    client_body_temp_path /opt/vuln_intel/app/ssl/nginx-tmp/body;
    fastcgi_temp_path     /opt/vuln_intel/app/ssl/nginx-tmp/fastcgi;
    proxy_temp_path       /opt/vuln_intel/app/ssl/nginx-tmp/proxy;
    scgi_temp_path        /opt/vuln_intel/app/ssl/nginx-tmp/scgi;
    uwsgi_temp_path       /opt/vuln_intel/app/ssl/nginx-tmp/uwsgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /opt/vuln_intel/app/ssl/nginx-access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Upstream: Aegis Dash app ──────────────────────────────────
    upstream aegis_app {
        server 127.0.0.1:9009;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────
    server {
        listen 8080;
        server_name vulne.expediteconsults.com _;
        return 301 https://$host:8443$request_uri;
    }

    # ── HTTPS reverse proxy ───────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name vulne.expediteconsults.com _;

        ssl_certificate     /opt/vuln_intel/app/ssl/aegis.crt;
        ssl_certificate_key /opt/vuln_intel/app/ssl/aegis.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Proxy to Dash ─────────────────────────────────────────
        location / {
            proxy_pass         http://aegis_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_connect_timeout 10s;
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── Static files ──────────────────────────────────────────
        location /assets/ {
            alias /opt/vuln_intel/app/assets/;
            expires 1d;
        }
    }
}
